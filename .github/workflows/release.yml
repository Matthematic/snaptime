name: Build & Release
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/checkout@v4
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v3
        with:
          node-version: "18.x"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm i
      - run: pnpm test
      - run: npm publish --provenance # pnpm publish is currently broken: https://github.com/pnpm/pnpm/issues/5894
